name: V2 dialogue rehearsal (no publishing)
on:
  push:
    branches: [experiment/shorts-v2]
    paths:
      - 'experiments/v2/parking-lot/dialogue.json'
      - 'tools/v2/readthrough.py'
      - '.github/workflows/v2-dialogue-rehearsal.yml'
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: bash tools/voicevox/start.sh
      - run: python tools/v2/readthrough.py experiments/v2/parking-lot/dialogue.json rehearsal
      - uses: actions/upload-artifact@v4
        with:
          name: parking-lot-table-read
          path: rehearsal/
          retention-days: 14
