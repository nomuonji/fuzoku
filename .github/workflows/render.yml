# 1話を GitHub Actions 上で書き出す（手動実行）。
# Actions → render → Run workflow → 話数（例: 001）
# 出力は Artifacts の「<no>-<slug>」に mp4・投稿用JSON・upload.txt・still.jpg。
# 「書き出したあと」で、ちんすけのチャンネルへ直接投稿するか、Driveの予約キューへ入れるかを選ぶ。
# 直接投稿は secrets の GOOGLE_SERVICE_ACCOUNT_JSON・GOOGLE_CLIENT_ID・GOOGLE_CLIENT_SECRET が要る（video-publisherと同じ値）。
# vo/ が揃っていない話は VOICEVOX を起動して声から作る。
name: render
on:
  workflow_dispatch:
    inputs:
      episode:
        description: 話数（productions/ の下のフォルダ名）
        required: true
        default: "001"
      post:
        description: 書き出したあと
        type: choice
        options: [書き出しだけ, 今すぐ投稿（公開）, 今すぐ投稿（非公開で確認）, ちんすけの予約キューへ]
        default: 書き出しだけ
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install -q numpy scipy pillow playwright google-api-python-client google-auth
          python -m playwright install --with-deps chromium
      - name: voice
        run: |
          EP=productions/${{ inputs.episode }}
          N=$(python -c "import json;print(len(json.load(open('$EP/lines.json'))))")
          HAVE=$(ls $EP/vo/*.wav 2>/dev/null | wc -l)
          if [ "$HAVE" -lt "$N" ]; then bash tools/voicevox/start.sh && python tools/vo.py $EP; else echo "vo ok ($HAVE/$N)"; fi
      - name: make
        run: WORKERS=4 python tools/make.py productions/${{ inputs.episode }}
      - id: name
        run: echo "n=$(python -c "import json;e=json.load(open('productions/${{ inputs.episode }}/episode.json'));print(e['no']+'-'+e['slug'])")" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.n }}
          path: |
            out/${{ steps.name.outputs.n }}.mp4
            out/${{ steps.name.outputs.n }}.upload.txt
            out/${{ steps.name.outputs.n }}.json
            productions/${{ inputs.episode }}/still.jpg
      - name: post
        if: ${{ inputs.post != '書き出しだけ' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MODE: ${{ inputs.post }}
          EP: productions/${{ inputs.episode }}
        run: |
          case "$MODE" in
            "今すぐ投稿（公開）") python tools/youtube.py $EP ;;
            "今すぐ投稿（非公開で確認）") python tools/youtube.py $EP --private ;;
            "ちんすけの予約キューへ") python tools/drive.py send $EP ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add $EP/episode.json $EP/still.jpg
          git commit -m "#${{ inputs.episode }}: $MODE" || true
          git push
