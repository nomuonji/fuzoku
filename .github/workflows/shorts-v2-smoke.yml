name: Shorts V2 smoke
on:
  push:
    branches: [experiment/shorts-v2]
    paths:
      - 'tools/v2/**'
      - '.github/workflows/shorts-v2-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python3 tools/v2/smoke.py
