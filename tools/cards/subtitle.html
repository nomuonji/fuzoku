<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:1080px;height:1920px;overflow:hidden;font-family:"Noto Serif CJK JP",serif;position:relative;background:#111}
  .bg{position:absolute;inset:0;background:
     linear-gradient(160deg,#3a3a3a 0%,#1a1a1a 45%,#050505 100%);}
  .blinds{position:absolute;inset:0;background:repeating-linear-gradient(170deg,rgba(255,255,255,.10) 0 38px,rgba(0,0,0,0) 38px 86px);
     -webkit-mask:radial-gradient(ellipse 60% 50% at 70% 30%,#000 30%,transparent 75%);}
  .grain{position:absolute;inset:0;opacity:.25;mix-blend-mode:screen}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.75) 100%)}
  .sub{position:absolute;left:40px;right:170px;top:1290px;text-align:center;color:#f2f2f2;font-size:58px;font-weight:500;
     letter-spacing:.08em;text-shadow:0 2px 10px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9)}
  .guide .ui{position:absolute;right:0;bottom:0;width:150px;height:900px;background:rgba(255,46,136,.18);border-left:2px dashed #ff2e88}
  .guide .ui2{position:absolute;left:0;right:0;bottom:0;height:330px;background:rgba(255,46,136,.18);border-top:2px dashed #ff2e88}
  .guide .ui3{position:absolute;left:0;right:0;top:0;height:200px;background:rgba(255,46,136,.12);border-bottom:2px dashed #ff2e88}
  .guide .lbl{position:absolute;font-family:"Noto Sans CJK JP";color:#ff8fbf;font-size:30px}
  .noguide .ui,.noguide .ui2,.noguide .ui3,.noguide .lbl{display:none}
</style></head>
<body class="__MODE__">
<div class="bg"></div><div class="blinds"></div>
<svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="vig"></div>
<div class="ui3"></div><div class="ui"></div><div class="ui2"></div>
<div class="lbl" style="left:30px;top:140px">上部UI（検索・カメラ）</div>
<div class="lbl" style="right:20px;top:1060px;writing-mode:vertical-rl">右側ボタン</div>
<div class="lbl" style="left:30px;bottom:270px">下部UI（タイトル・音源）</div>
<div class="sub">だが今、レジを打っている。</div>
</body></html>
