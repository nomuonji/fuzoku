<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1080px;height:1920px;overflow:hidden;font-family:"Noto Serif CJK JP",serif;}
  .bg{position:absolute;inset:0;background:
      radial-gradient(ellipse 70% 45% at 50% 42%, rgba(255,46,136,.16), rgba(0,0,0,0) 70%),
      linear-gradient(180deg,#0b0b0c 0%,#141416 55%,#070708 100%);}
  .transparent .bg,.transparent .grain,.transparent .rain,.transparent .wet{display:none}
  .transparent body{background:transparent}
  .grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:screen}
  .rain{position:absolute;inset:0;opacity:.18;
      background:repeating-linear-gradient(100deg, rgba(255,255,255,.0) 0 22px, rgba(255,255,255,.35) 22px 23px, rgba(255,255,255,0) 23px 61px);}
  .wet{position:absolute;left:0;right:0;bottom:0;height:520px;
      background:linear-gradient(180deg,rgba(0,0,0,0),rgba(255,46,136,.07) 40%,rgba(0,0,0,.6));}
  .neon{position:absolute;left:0;right:0;top:640px;display:flex;justify-content:center;gap:40px;
      writing-mode:vertical-rl;}
  .neon{writing-mode:horizontal-tb}
  .col{writing-mode:vertical-rl;font-weight:700;font-size:150px;letter-spacing:.06em;line-height:1;
      color:#ffe3f0;
      -webkit-text-stroke:3px #ff2e88;
      text-shadow:0 0 6px #ff7ab4,0 0 18px #ff2e88,0 0 42px #ff2e88,0 0 90px rgba(255,46,136,.8),0 0 160px rgba(255,46,136,.5);}
  .col.sub{font-size:110px;margin-top:0;opacity:.95}
  .flicker{opacity:.55}
  .foot{position:absolute;left:0;right:0;bottom:250px;text-align:center;color:#d9d9d9;
      font-size:34px;letter-spacing:.5em;font-weight:500;opacity:.8}
  .foot b{display:block;font-size:26px;letter-spacing:.3em;margin-top:18px;opacity:.7;font-weight:500}
</style></head>
<body class="__MODE__">
<div class="bg"></div>
<svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="rain"></div>
<div class="wet"></div>
<div class="neon" style="top:__TOP__px">
  <div class="col">風俗行こう<span class="flicker">。</span></div>
  <div class="col sub">そうだ、</div>
</div>
<div class="foot">くだらない世界<b>#001</b></div>
</body></html>
